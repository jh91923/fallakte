<script>
const KEY='fallhilfe_v1',DOCS=['Aufenthaltsgestattung','Aufenthaltserlaubnis','Duldung','Pass','Krankenkasse','Geburtsurkunde'],

let db=load(),tab='home',detail=null,q='',flt='open',calendarView='list',calendarMonth='',selectedCalendarDay='';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch(e){}return{families:[],tasks:[],reminders:[],appts:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Speichern fehlgeschlagen (Speicher voll?)')}}
const $=s=>document.querySelector(s),M=$('#modal'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),T=ymd(new Date());

const fam=id=>db.families.find(f=>f.id==id),fn=id=>fam(id)?.name||'–';

const members=f=>Array.isArray(f.members)?f.members:[];
const count=f=>isFamily(f)?1+members(f).length:1;
const extraDocs=p=>Array.isArray(p.customDocs)?p.customDocs:[];
const allDocs=p=>[...DOCS.map((name,i)=>({name,s:p.docs?.[i]?.s||'',e:p.docs?.[i]?.e||''})),...extraDocs(p)];

const attending=p=>p.attendsInstitution==='Ja'||(p.attendsInstitution===undefined&&!!(p.school||p.afternoonCare||p.careProvider||p.renewBut||p.renewProvider||p.renewYouth));
const careBenefitFields=[
 {k:'renewBut',l:'Bildung und Teilhabe (Mittagessen) – Bewilligung bis',t:'date',showIf:{k:'afternoonCare',value:'Ja'}},
 {k:'renewProvider',l:'Träger der Nachmittagsbetreuung – Bewilligung bis',t:'date',showIf:{k:'afternoonCare',value:'Ja'}},
 {k:'renewYouth',l:'Jugendamt (Nachmittagsbetreuung) – Bewilligung bis',t:'date',showIf:{k:'afternoonCare',value:'Ja'}}];
const otherBenefits=[
 {flag:'benefitSgb12',date:'benefitSgb12Until',label:'Grundsicherung (SGB XII)'},
 {flag:'benefitSgb2',date:'benefitSgb2Until',label:'Jobcenter (SGB II)'},
 {flag:'benefitChild',date:'benefitChildUntil',label:'Kindergeld'},
 {flag:'benefitAsyl',label:'Asylbewerberleistungen'}];
const perFields=[
 {k:'gender',l:'Geschlecht',t:'select',o:[['','Bitte auswählen'],['männlich','männlich'],['weiblich','weiblich']]},
 {k:'employer',l:'Arbeitgeber'},
 {k:'attendsInstitution',l:'Besucht die Person einen Kindergarten bzw. eine Schule?',t:'select',o:[['','Bitte auswählen'],['Ja','Ja'],['Nein','Nein']]},
 {k:'school',l:'Kindergarten bzw. Schule',showIf:{k:'attendsInstitution',value:'Ja'}},
 {k:'schoolClass',l:'Klasse / Gruppe',showIf:{k:'attendsInstitution',value:'Ja'}},
 {k:'schoolYear',l:'Schuljahr',showIf:{k:'attendsInstitution',value:'Ja'}},
 {k:'clubs',l:'Sonstiges',t:'textarea'},
 {k:'afternoonCare',l:'Wird Nachmittagsbetreuung im Kindergarten bzw. in der Schule in Anspruch genommen?',t:'select',o:[['','Bitte auswählen'],['Ja','Ja'],['Nein','Nein']],showIf:{k:'attendsInstitution',value:'Ja'}},
 {k:'careProvider',l:'Träger der Nachmittagsbetreuung',showIf:{k:'afternoonCare',value:'Ja'}},
 {k:'benefitsHeading',l:'Erhaltene Leistungen',t:'heading'},
 ...careBenefitFields,
 ...otherBenefits.flatMap(b=>[
  {k:b.flag,l:b.label+' – wird die Leistung bezogen?',t:'select',o:[['','Bitte auswählen'],['Ja','Ja'],['Nein','Nein']]},
  ...(b.date?[{k:b.date,l:b.label+' – Bewilligung bis',t:'date',showIf:{k:b.flag,value:'Ja'}}]:[])
 ])
];
const names=p=>{if(p.firstName||p.lastName)return {firstName:p.firstName||'',lastName:p.lastName||''};const n=(p.name||'').trim(),i=n.lastIndexOf(' ');return {firstName:i<0?n:n.slice(0,i),lastName:i<0?'':n.slice(i+1)}};
const docFormFields=[{k:'docsHeading',l:'Dokumente der Person',t:'heading'},...DOCS.flatMap((d,i)=>[{k:'docStatus'+i,l:d+' – Status',t:'select',o:[['','Bitte auswählen'],['Vorhanden','Vorhanden'],['Beantragt','Beantragt'],['Fehlt','Fehlt']]},{k:'docExpiry'+i,l:d+' – gültig bis',t:'date'}])];
const docFormValues=p=>Object.fromEntries(DOCS.flatMap((d,i)=>[['docStatus'+i,p.docs?.[i]?.s||''],['docExpiry'+i,p.docs?.[i]?.e||'']]));
const saveDocForm=o=>{const docs=DOCS.map((d,i)=>({s:o['docStatus'+i]||'',e:o['docExpiry'+i]||''}));DOCS.forEach((d,i)=>{delete o['docStatus'+i];delete o['docExpiry'+i]});o.docs=docs;return o};
const personFormValue=p=>({...p,...names(p),...docFormValues(p),attendsInstitution:attending(p)?'Ja':p.attendsInstitution||''});
const normalizePerson=o=>{o.name=[o.firstName,o.lastName].filter(Boolean).join(' ').trim();if(o.attendsInstitution!=='Ja'){o.school='';o.schoolClass='';o.schoolYear='';o.afternoonCare='';}if(o.afternoonCare!=='Ja'||o.attendsInstitution!=='Ja'){o.careProvider='';o.renewBut='';o.renewProvider='';o.renewYouth='';}return o};
const personRows=(p,additional=false)=>[['Vorname',names(p).firstName],['Nachname',names(p).lastName],['Geburtsdatum',fmt(p.birthDate)],['Geschlecht',p.gender],...(additional?[['Verwandtschaftsstatus',p.relationship],['Telefonnummer',p.phone],['E-Mail-Adresse',p.email]]:[]),['Arbeitgeber',p.employer],['Besucht Kindergarten bzw. Schule',p.attendsInstitution||(attending(p)?'Ja':'')],['Kindergarten bzw. Schule',p.school],['Klasse / Gruppe',p.schoolClass],['Schuljahr',p.schoolYear],['Sonstiges',p.clubs],...(attending(p)?[['Nachmittagsbetreuung',p.afternoonCare],...(p.afternoonCare==='Ja'?[['Träger der Nachmittagsbetreuung',p.careProvider]]:[])]:[])];
const benefitRows=p=>[
 ...(attending(p)&&p.afternoonCare==='Ja'?[['Bildung und Teilhabe (Mittagessen) – Bewilligung bis',fmt(p.renewBut)],['Träger der Nachmittagsbetreuung – Bewilligung bis',fmt(p.renewProvider)],['Jugendamt (Nachmittagsbetreuung) – Bewilligung bis',fmt(p.renewYouth)]]:[]),
 ...otherBenefits.flatMap(b=>[
  ...(p[b.flag] && !(p[b.flag]==='Ja' && p[b.date] && (b.flag==='benefitSgb12'||b.flag==='benefitSgb2'))?[ [b.label+' – Leistung erhalten',p[b.flag]] ]:[]),
 ...(b.date&&p[b.flag]==='Ja'&&p[b.date]?[ [b.label+' – Bewilligung bis',fmt(p[b.date])] ]:[])
 ])
];
const infoRows=(pairs,print=false)=>pairs.filter(([k,v])=>String(v??'').trim()).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v).replace(/\n/g,print?'<br>':'\n')}</td></tr>`).join('');
const personRenewals=p=>[...(attending(p)&&p.afternoonCare==='Ja'?[p.renewBut,p.renewProvider,p.renewYouth]:[]),...otherBenefits.filter(b=>b.date&&p[b.flag]==='Ja').map(b=>p[b.date])].filter(Boolean);
const dc=(d,done)=>done||!d?'g':days(d)<0?'r':days(d)<=14?'y':'g',dot=c=>`<i class="dot ${c}"></i>`;
function famCls(f){
 let w='g';
 const up=c=>{if(c==='r')w='r';else if(c==='y'&&w!=='r')w='y'};
 [...db.tasks,...db.reminders].filter(x=>x.famId===f.id&&!x.done&&x.due).forEach(x=>up(dc(x.due)));
 db.appts.filter(x=>x.famId===f.id&&!x.done&&x.date&&days(x.date)>=0).forEach(x=>up(dc(x.date)));
 // Andere Dokumente und Bewilligungen behalten ihre bisherige Ampellogik.
 // SGB II und XII werden getrennt ausgewertet, da ihre Fristen sechs Wochen
 // vorher beginnen und erledigte Kalendererinnerungen nicht mehr warnen dürfen.
 [f,...(isFamily(f)?members(f):[])].forEach(p=>{
  allDocs(p).forEach(d=>{if(d.e)up(dc(d.e))});
  if(attending(p)&&p.afternoonCare==='Ja')
   [p.renewBut,p.renewProvider,p.renewYouth].forEach(d=>{if(d)up(dc(d))});
  if(p.benefitChild==='Ja'&&p.benefitChildUntil)up(dc(p.benefitChildUntil));
 });
 deadlineAppointments().filter(x=>x.famId===f.id&&!x.done&&
  (x.id.includes('|benefitSgb2Until|')||x.id.includes('|benefitSgb12Until|'))).forEach(x=>{
   const remaining=days(x.expiry);
   if(remaining<0)up('r');
   else if(remaining<=42)up('y');
 });
 return w;
}
const famOpts=()=>[['','– keine –'],...db.families.map(f=>[f.id,f.name])];
const S={
 families:{t:'Akte',f:()=>[{k:'isFamily',l:'Familienakte – weitere Personen hinzufügen',t:'checkbox'},{k:'firstName',l:'Vorname der hauptbetroffenen Person'},{k:'lastName',l:'Nachname der hauptbetroffenen Person'},{k:'birthDate',l:'Geburtsdatum der hauptbetroffenen Person',t:'date'},...perFields,{k:'contact',l:'Ansprechpartner'},{k:'country',l:'Herkunftsland'},{k:'phone',l:'Telefonnummer',t:'tel'},{k:'email',l:'E-Mail',t:'email'},{k:'address',l:'Unterkunft / Adresse'},{k:'moveIn',l:'Eingezogen am',t:'date'},{k:'moveOut',l:'Ausgezogen am',t:'date'},{k:'notes',l:'Notizen',t:'textarea'},...docFormFields]},
 tasks:{t:'Aufgabe',f:()=>[{k:'title',l:'Aufgabe'},{k:'famId',l:'Akte',t:'select',o:famOpts()},{k:'due',l:'Fälligkeitsdatum',t:'date'},{k:'prio',l:'Priorität',t:'select',o:PR},{k:'done',l:'Status',t:'select',o:[['','Offen'],['1','Erledigt']]}],d:{prio:'Mittel',due:T}},
 reminders:{t:'Wiedervorlage',f:()=>[{k:'type',l:'Stelle',t:'select',o:REM},{k:'title',l:'Worum geht es?'},{k:'famId',l:'Akte',t:'select',o:famOpts()},{k:'due',l:'Wiedervorlage am',t:'date'},{k:'done',l:'Status',t:'select',o:[['','Offen'],['1','Erledigt']]}],d:{due:T}},
 appts:{t:'Termin',f:()=>[{k:'date',l:'Datum',t:'date'},{k:'time',l:'Uhrzeit',t:'time'},{k:'agency',l:'Behörde / Terminart'},{k:'contact',l:'Ansprechpartner'},{k:'famId',l:'Akte',t:'select',o:famOpts()},{k:'notes',l:'Notizen',t:'textarea'},{k:'done',l:'Status',t:'select',o:[['','Offen'],['1','Erledigt']]}],d:{date:T}}};
function form(title,fields,v,onSave,onDel){
 let h=`<h2>${title}</h2>`;
 for(const f of fields){if(f.t==='heading'){h+=`<h3 style="margin-top:20px;border-bottom:1px solid var(--b);padding-bottom:8px">${esc(f.l)}</h3>`;continue}const val=v[f.k]??'';h+=`<label data-field="${f.k}"${f.t=='checkbox'?' style="display:flex;align-items:center;gap:12px"':''}>${f.t=='checkbox'?'':esc(f.l)}`;
  if(f.t=='checkbox')h+=`<input id="f_${f.k}" type="checkbox" ${val?'checked':''}> ${esc(f.l)}`;
  else if(f.t=='select')h+=`<select id="f_${f.k}">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}"${a==val?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else if(f.t=='textarea')h+=`<textarea id="f_${f.k}" rows="3">${esc(val)}</textarea>`;
  else h+=`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(val)}">`;h+='</label>'}
 h+=`<div class="btns"><button class="p" id="ok">Speichern</button><button id="no">Abbrechen</button>${onDel?'<button class="d" id="del">Löschen</button>':''}</div>`;
 M.innerHTML='<div class="sheet">'+h+'</div>';M.style.display='flex';M.querySelector('.sheet').scrollTop=0;updateVisualViewport();
 const conditional=()=>{for(const f of fields){if(!f.showIf)continue;const own=$('#f_'+f.showIf.k);const visible=own&&own.value===f.showIf.value&&(!['careProvider','renewBut','renewProvider','renewYouth'].includes(f.k)||$('#f_attendsInstitution')?.value==='Ja');const label=M.querySelector('[data-field="'+f.k+'"]');if(label)label.style.display=visible?'':'none';}};
 fields.forEach(f=>{if(f.k==='attendsInstitution'||f.k==='afternoonCare'||otherBenefits.some(b=>b.flag===f.k))$('#f_'+f.k).addEventListener('change',conditional)});conditional();
 const close=()=>{M.style.display='none';M.innerHTML='';document.body.classList.remove('keyboard-open')};$('#no').onclick=close;
 $('#ok').onclick=()=>{const o={...v};fields.filter(f=>f.t!=='heading').forEach(f=>o[f.k]=f.t=='checkbox'?$('#f_'+f.k).checked:$('#f_'+f.k).value.trim());if(onSave(o)!==false)close()};

function edit(c,id,pre){const s=S[c],cur=id&&db[c].find(x=>x.id==id);
 form((id?'Bearbeiten: ':'Neu: ')+s.t,s.f(),cur?{...cur,...(c==='families'?personFormValue(cur):{}),isFamily:c==='families'?isFamily(cur):false,done:cur.done?'1':''}:{...(s.d||{}),...(pre||{}),...(c=='families'?{isFamily:false}:{})},o=>{o.done=o.done?1:'';
  if(c=='families'){if(!o.firstName||!o.lastName){alert('Bitte Vor- und Nachnamen eingeben.');return false}normalizePerson(o);saveDocForm(o);saveDocForm(o)}
  if(c=='families'&&cur&&isFamily(cur)&&!o.isFamily&&members(cur).length&&!confirm('Weitere Personen bleiben gespeichert, werden aber ausgeblendet, solange die Familienakte deaktiviert ist. Fortfahren?'))return false;

function pdf(id){const f=fam(id);if(!f)return alert('Bitte zuerst eine Akte anlegen.');
 const tb=(h,rows)=>{if(!rows.length)return '';const indices=h.map((_,i)=>i).filter(i=>rows.some(row=>String(row[i]??'').trim()));return indices.length?`<table><tr>${indices.map(i=>`<th>${esc(h[i])}</th>`).join('')}</tr>${rows.map(c=>`<tr>${indices.map(i=>`<td>${esc(c[i])}</td>`).join('')}</tr>`).join('')}</table>`:''};

 const base=[...personRows(f).slice(0,3),['Ansprechpartner',f.contact],['Herkunftsland',f.country],...(isFamily(f)?[['Personen',count(f)]]:[]),...(f.births?[['Frühere Geburtsdaten (Altbestand)',f.births]]:[]),['Telefon',f.phone],['E-Mail',f.email],['Unterkunft',f.address],['Eingezogen am',fmt(f.moveIn)],['Ausgezogen am',fmt(f.moveOut)],...personRows(f).slice(3),['Notizen',f.notes]];

 ${section('Aufgaben',['Aufgabe','Fällig','Prio','Status'],db.tasks.filter(x=>x.famId==id).map(t=>[t.title,fmt(t.due),t.prio,t.done?'erledigt':'offen']))}
 ${section('Wiedervorlagen',['Stelle','Betreff','Datum','Status'],db.reminders.filter(x=>x.famId==id).map(t=>[t.type,t.title,fmt(t.due),t.done?'erledigt':'offen']))}

// PDF-Erstellung ohne Online-Dienste oder externe Bibliotheken.
// iOS-Homebildschirm-Apps koennen den Druckdialog blockieren. Deshalb wird eine
// echte PDF-Datei lokal erzeugt und ueber das iOS-Teilen-Menue bereitgestellt.
let currentPdfFile=null;
function pdfLinesFromPrint(){
 const lines=[];
 const add=(value,kind='text')=>{const t=String(value||'').replace(/\s+/g,' ').trim();if(t)lines.push({text:t,kind})};
 for(const el of $('#print').children){
  const tag=el.tagName.toLowerCase();
  if(/^h[1-6]$/.test(tag)){add(el.textContent,tag);continue}
  if(tag==='p'){add(el.textContent,'sub');continue}
  if(tag!=='table')continue;
  const rows=[...el.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.textContent.trim()));
  if(!rows.length)continue;
  const header=el.querySelector('tr')?.children;
  const isHeader=header&&[...header].every(cell=>cell.tagName==='TH');
  const heads=isHeader?rows.shift():null;
  for(const cells of rows){
   if(heads){
    const first=cells[0]||'';if(first)add(first,'entry');
    cells.slice(1).forEach((v,i)=>{if(v)add((heads[i+1]||'Angabe')+': '+v,'indent')});
   }else if(cells.length===2){
    if(cells[1])add(cells[0]+': '+cells[1],'text');
   }else{
    add(cells.filter(Boolean).join(' · '),'text');
   }
  }
 }
 return lines;
}
function createPdfFromLines(lines){
 const W=1190,H=1684,L=90,R=90,TOP=90,BOTTOM=100;
 let canvas,ctx,y,pages=[];
 const begin=()=>{canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.textBaseline='top';y=TOP};
 const finish=()=>{pages.push(atob(canvas.toDataURL('image/jpeg',0.82).split(',')[1]));};
 const metrics={h1:[39,52,22,'700'],h2:[31,43,22,'700'],h3:[27,37,14,'700'],sub:[22,35,17,'400'],entry:[25,36,9,'700'],indent:[22,31,3,'400'],text:[23,34,7,'400']};
 begin();
 for(const line of lines){
  const [size,height,space,weight]=metrics[line.kind]||metrics.text;
  ctx.font=weight+' '+size+'px system-ui, Arial, sans-serif';
  const available=W-L-R-(line.kind==='indent'?20:0);
  const words=line.text.split(/\s+/);const wrapped=[];let current='';
  for(let word of words){
   while(ctx.measureText(word).width>available&&word.length>1){
    let cut=word.length-1;
    while(cut>1&&ctx.measureText(word.slice(0,cut)+'-').width>available)cut--;
    if(current){wrapped.push(current);current=''}
    wrapped.push(word.slice(0,cut)+'-');word=word.slice(cut);
   }
   if(!current)current=word;
   else if(ctx.measureText(current+' '+word).width<=available)current+=' '+word;
   else{wrapped.push(current);current=word}
  }
  if(current)wrapped.push(current);
  const blockHeight=space+wrapped.length*height;
  if(y+blockHeight>H-BOTTOM&&y>TOP){finish();begin();ctx.font=weight+' '+size+'px system-ui, Arial, sans-serif'}
  y+=space;
  ctx.fillStyle='#182332';
  wrapped.forEach(part=>{if(y+height>H-BOTTOM){finish();begin();ctx.font=weight+' '+size+'px system-ui, Arial, sans-serif'}ctx.fillText(part,L+(line.kind==='indent'?20:0),y);y+=height});
 }
 finish();
 // Bild-PDF mit A4-Seiten, komplett offline erzeugt.
 const parts=[];let offset=0,offsets=[0];
 const append=b=>{parts.push(b);offset+=b.length};
 const object=(n,body)=>{offsets[n]=offset;append(n+' 0 obj\n'+body+'\nendobj\n')};
 const binToBytes=s=>{const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b};
 append('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
 const pageRefs=pages.map((_,i)=>(3+i*3)+' 0 R').join(' ');
 object(1,'<< /Type /Catalog /Pages 2 0 R >>');
 object(2,'<< /Type /Pages /Kids ['+pageRefs+'] /Count '+pages.length+' >>');
 pages.forEach((jpg,i)=>{
  const pn=3+i*3, img=pn+1,cont=pn+2;
  object(pn,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+img+' 0 R >> >> /Contents '+cont+' 0 R >>');
  offsets[img]=offset;
  append(img+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');
  append(jpg);append('\nendstream\nendobj\n');
  const content='q\n595 0 0 842 0 0 cm\n/Im0 Do\nQ\n';
  object(cont,'<< /Length '+content.length+' >>\nstream\n'+content+'endstream');
 });
 const startXref=offset,n=3+pages.length*3;
 append('xref\n0 '+n+'\n0000000000 65535 f \n');
 for(let i=1;i<n;i++)append(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 append('trailer\n<< /Size '+n+' /Root 1 0 R >>\nstartxref\n'+startXref+'\n%%EOF');
 return new Blob(parts.map(binToBytes),{type:'application/pdf'});
}
function showPdfOptions(f){
 try{
  const pdfBlob=createPdfFromLines(pdfLinesFromPrint());
  const fileName='Fallakte_'+(f.name||'Akte').replace(/[^a-zA-Z0-9äöüÄÖÜß_-]+/g,'_').slice(0,65)+'.pdf';
  currentPdfFile=new File([pdfBlob],fileName,{type:'application/pdf'});
  M.innerHTML=`<div class="sheet"><h2>Fallakte als PDF speichern</h2><p>Die PDF-Datei wurde lokal auf diesem Gerät erstellt.</p><p>Auf dem iPhone bitte <b>Teilen / In Dateien sichern</b> wählen und im Teilen-Menü <b>In Dateien sichern</b> antippen.</p><div class="btns"><button class="p" id="pdfshare">📤 Teilen / In Dateien sichern</button><button id="pdfdownload">⬇️ PDF herunterladen</button><button id="pdfprint">🖨️ Drucken</button><button id="pdfclose">Schließen</button></div><p style="font-size:13px;color:var(--m)">Die PDF enthält personenbezogene Daten und sollte geschützt gespeichert werden. Es werden keine Daten ins Internet übertragen.</p></div>`;
  M.style.display='flex';
  $('#pdfclose').onclick=()=>{M.style.display='none';M.innerHTML=''};
  $('#pdfshare').onclick=()=>{
   if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[currentPdfFile]}))){
    navigator.share({files:[currentPdfFile],title:'Fallakte'}).catch(err=>{if(err.name!=='AbortError')alert('Teilen nicht möglich. Bitte „PDF herunterladen“ verwenden.')});
   }else alert('Das Teilen von PDF-Dateien wird hier nicht unterstützt. Bitte „PDF herunterladen“ verwenden oder die App in Safari öffnen.');
  };
  $('#pdfdownload').onclick=()=>{
   const url=URL.createObjectURL(currentPdfFile);
   const a=document.createElement('a');a.href=url;a.download=currentPdfFile.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  };
  $('#pdfprint').onclick=()=>{M.style.display='none';setTimeout(()=>window.print(),100)};
 }catch(e){console.error(e);alert('Die PDF konnte nicht erzeugt werden. Bitte alternativ die Druckfunktion verwenden.');setTimeout(()=>window.print(),100)}
}

// Auf Mobilgeräten ändert die Browser-/Tastaturleiste den tatsächlich sichtbaren Ausschnitt.
// Das Bearbeitungsformular wird auf diesen Ausschnitt begrenzt und bleibt separat scrollbar.
function updateVisualViewport(){
 const vv=window.visualViewport;if(!vv)return;
 document.documentElement.style.setProperty('--vv-height',vv.height+'px');
 document.documentElement.style.setProperty('--vv-top',vv.offsetTop+'px');
 const keyboardVisible=window.innerWidth<=700&&vv.height<window.innerHeight-140;
 document.body.classList.toggle('keyboard-open',keyboardVisible);
}
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',updateVisualViewport);
 window.visualViewport.addEventListener('scroll',updateVisualViewport);
}
window.addEventListener('resize',updateVisualViewport);
document.addEventListener('focusin',e=>{
 if(!e.target.closest?.('#modal'))return;
 requestAnimationFrame(()=>e.target.scrollIntoView({block:'nearest',behavior:'instant'}));
});
updateVisualViewport();
render();
