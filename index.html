<script>
const KEY='fallhilfe_v1',DOCS=['Aufenthaltsgestattung','Aufenthaltserlaubnis','Duldung','Pass','Krankenkasse','Geburtsurkunde'],

 {k:'school',l:'Kindergarten bzw. Schule',showIf:{k:'attendsInstitution',value:'Ja'}},
 {k:'schoolClass',l:'Klasse / Gruppe',showIf:{k:'attendsInstitution',value:'Ja'}},

 {k:'clubs',l:'Sonstiges',t:'textarea'},
 {k:'afternoonCare',l:'Wird Nachmittagsbetreuung im Kindergarten bzw. in der Schule in Anspruch genommen?',t:'select',o:[['','Bitte auswählen'],['Ja','Ja'],['Nein','Nein']],showIf:{k:'attendsInstitution',value:'Ja'}},

  {k:b.flag,l:b.label+' – wird die Leistung bezogen?',t:'select',o:[['','Bitte auswählen'],['Ja','Ja'],['Nein','Nein']]},

 ])

const normalizePerson=o=>{o.name=[o.firstName,o.lastName].filter(Boolean).join(' ').trim();if(o.attendsInstitution!=='Ja'){o.school='';o.schoolClass='';o.schoolYear='';o.afternoonCare='';}if(o.afternoonCare!=='Ja'||o.attendsInstitution!=='Ja'){o.careProvider='';o.renewBut='';o.renewProvider='';o.renewYouth='';}return o};
const personRows=p=>[['Vorname',names(p).firstName],['Nachname',names(p).lastName],['Geburtsdatum',fmt(p.birthDate)],['Geschlecht',p.gender],['Arbeitgeber',p.employer],['Besucht Kindergarten bzw. Schule',p.attendsInstitution||(attending(p)?'Ja':'')],['Kindergarten bzw. Schule',p.school],['Klasse / Gruppe',p.schoolClass],['Schuljahr',p.schoolYear],['Sonstiges',p.clubs],...(attending(p)?[['Nachmittagsbetreuung',p.afternoonCare],...(p.afternoonCare==='Ja'?[['Träger der Nachmittagsbetreuung',p.careProvider]]:[])]:[])];
const benefitRows=p=>[
 ...(attending(p)&&p.afternoonCare==='Ja'?[['Bildung und Teilhabe (Mittagessen) – Bewilligung bis',fmt(p.renewBut)],['Träger der Nachmittagsbetreuung – Bewilligung bis',fmt(p.renewProvider)],['Jugendamt (Nachmittagsbetreuung) – Bewilligung bis',fmt(p.renewYouth)]]:[]),
 ...otherBenefits.flatMap(b=>[
  ...(p[b.flag] && !(p[b.flag]==='Ja' && p[b.date] && (b.flag==='benefitSgb12'||b.flag==='benefitSgb2'))?[ [b.label+' – Leistung erhalten',p[b.flag]] ]:[]),
 ...(p[b.flag]==='Ja'&&p[b.date]?[ [b.label+' – Bewilligung bis',fmt(p[b.date])] ]:[])
 ])
];
const infoRows=(pairs,print=false)=>pairs.filter(([k,v])=>String(v??'').trim()).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v).replace(/\n/g,print?'<br>':'\n')}</td></tr>`).join('');
const personRenewals=p=>[...(attending(p)&&p.afternoonCare==='Ja'?[p.renewBut,p.renewProvider,p.renewYouth]:[]),...otherBenefits.filter(b=>p[b.flag]==='Ja').map(b=>p[b.date])].filter(Boolean);
const dc=(d,done)=>done||!d?'g':days(d)<0?'r':days(d)<=14?'y':'g',dot=c=>`<i class="dot ${c}"></i>`;
function famCls(f){let w='g';const up=c=>{if(c=='r')w='r';else if(c=='y'&&w!='r')w='y'};
 [...db.tasks,...db.reminders].filter(x=>x.famId==f.id&&!x.done&&x.due).forEach(x=>up(dc(x.due)));

 [f,...(isFamily(f)?members(f):[])].forEach(p=>{allDocs(p).forEach(d=>{if(d.e)up(dc(d.e))});personRenewals(p).forEach(d=>up(dc(d)))});return w}
const famOpts=()=>[['','– keine –'],...db.families.map(f=>[f.id,f.name])];
const S={
 families:{t:'Akte',f:()=>[{k:'firstName',l:'Vorname der hauptbetroffenen Person'},{k:'lastName',l:'Nachname der hauptbetroffenen Person'},{k:'birthDate',l:'Geburtsdatum der hauptbetroffenen Person',t:'date'},...perFields,{k:'isFamily',l:'Familienakte – weitere Personen hinzufügen',t:'checkbox'},{k:'contact',l:'Ansprechpartner'},{k:'country',l:'Herkunftsland'},{k:'phone',l:'Telefonnummer',t:'tel'},{k:'email',l:'E-Mail',t:'email'},{k:'address',l:'Unterkunft / Adresse'},{k:'moveIn',l:'Einzugsdatum',t:'date'},{k:'notes',l:'Notizen',t:'textarea'}]},
 tasks:{t:'Aufgabe',f:()=>[{k:'title',l:'Aufgabe'},{k:'famId',l:'Akte',t:'select',o:famOpts()},{k:'due',l:'Fälligkeitsdatum',t:'date'},{k:'prio',l:'Priorität',t:'select',o:PR},{k:'done',l:'Status',t:'select',o:[['','Offen'],['1','Erledigt']]}],d:{prio:'Mittel',due:T}},
 reminders:{t:'Wiedervorlage',f:()=>[{k:'type',l:'Stelle',t:'select',o:REM},{k:'title',l:'Worum geht es?'},{k:'famId',l:'Akte',t:'select',o:famOpts()},{k:'due',l:'Wiedervorlage am',t:'date'},{k:'done',l:'Status',t:'select',o:[['','Offen'],['1','Erledigt']]}],d:{due:T}},
 appts:{t:'Termin',f:()=>[{k:'date',l:'Datum',t:'date'},{k:'time',l:'Uhrzeit',t:'time'},{k:'agency',l:'Behörde'},{k:'contact',l:'Ansprechpartner'},{k:'famId',l:'Akte',t:'select',o:famOpts()},{k:'notes',l:'Notizen',t:'textarea'}],d:{date:T}}};
function form(title,fields,v,onSave,onDel){
 let h=`<h2>${title}</h2>`;
 for(const f of fields){if(f.t==='heading'){h+=`<h3 style="margin-top:20px;border-bottom:1px solid var(--b);padding-bottom:8px">${esc(f.l)}</h3>`;continue}const val=v[f.k]??'';h+=`<label data-field="${f.k}"${f.t=='checkbox'?' style="display:flex;align-items:center;gap:12px"':''}>${f.t=='checkbox'?'':esc(f.l)}`;

  else if(f.t=='select')h+=`<select id="f_${f.k}">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}"${a==val?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;

 M.innerHTML='<div class="sheet">'+h+'</div>';M.style.display='flex';M.querySelector('.sheet').scrollTop=0;updateVisualViewport();
 const conditional=()=>{for(const f of fields){if(!f.showIf)continue;const own=$('#f_'+f.showIf.k);const visible=own&&own.value===f.showIf.value&&(!['careProvider','renewBut','renewProvider','renewYouth'].includes(f.k)||$('#f_attendsInstitution')?.value==='Ja');const label=M.querySelector('[data-field="'+f.k+'"]');if(label)label.style.display=visible?'':'none';}};

 const close=()=>{M.style.display='none';M.innerHTML='';document.body.classList.remove('keyboard-open')};$('#no').onclick=close;

function edit(c,id,pre){const s=S[c],cur=id&&db[c].find(x=>x.id==id);
 form((id?'Bearbeiten: ':'Neu: ')+s.t,s.f(),cur?{...cur,...(c==='families'?personFormValue(cur):{}),isFamily:c==='families'?isFamily(cur):false,done:cur.done?'1':''}:{...(s.d||{}),...(pre||{}),...(c=='families'?{isFamily:false}:{})},o=>{o.done=o.done?1:'';

  cur&&(()=>{db[c]=db[c].filter(x=>x.id!=id);if(c=='families')detail=null;save();render()}))}
function editDocs(id,personId){const f=fam(id),person=personId?members(f).find(p=>p.id==personId):f;if(!person)return;const fields=[];

function item(c,x){const d=c=='appts'?x.date:x.due,cls=dc(d,x.done);
 const title=c=='appts'?`${fmt(x.date)} ${x.time||''} · ${esc(x.agency)}`:c=='reminders'?`${esc(x.type)}: ${esc(x.title)}`:esc(x.title);
 const sub=c=='appts'?`${esc(x.contact)} · ${esc(fn(x.famId))}`:`${fmt(x.due)} · ${esc(fn(x.famId))}${x.prio?' · '+x.prio:''}`;
 return`<div class="row ${x.done?'done':''}">${c!='appts'?`<input type="checkbox" ${x.done?'checked':''} onchange="tog('${c}','${x.id}')">`:''}${dot(cls)}<div class="x" onclick="edit('${c}','${x.id}')">${title}<small>${sub}</small></div></div>`}
// Fristerinnerungen sind abgeleitete Termine und werden nicht in der Datensicherung dupliziert.
const minus28=d=>{const date=new Date(d+'T12:00:00Z');if(Number.isNaN(date.getTime()))return '';date.setUTCDate(date.getUTCDate()-28);return date.toISOString().slice(0,10)};
function deadlineAppointments(){
 const found=[];
 for(const f of db.families){
  for(const p of [f,...(isFamily(f)?members(f):[])]){
   const person=p.name||[names(p).firstName,names(p).lastName].filter(Boolean).join(' ')||f.name;
   const add=(expiry,type)=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(expiry||''))return;const date=minus28(expiry);if(!date)return;
    found.push({auto:true,date,time:'',famId:f.id,agency:type,contact:person,expiry,
      notes:'Automatische Erinnerung: '+person+' – '+type+'; gültig/bewilligt bis '+fmt(expiry)});
   };
   if(attending(p)&&p.afternoonCare==='Ja'){
    add(p.renewBut,'Bildung und Teilhabe (Mittagessen) – Bewilligung bis');
    add(p.renewProvider,'Träger der Nachmittagsbetreuung – Bewilligung bis');
    add(p.renewYouth,'Jugendamt (Nachmittagsbetreuung) – Bewilligung bis');
   }
   otherBenefits.forEach(b=>{if(p[b.flag]==='Ja')add(p[b.date],b.label+' – Bewilligung bis')});
   allDocs(p).forEach(d=>{if(d.e&&d.s!=='Fehlt'&&d.s!=='Beantragt')add(d.e,'Dokument: '+d.name)});
  }
 }
 return found;
}
const allAppointments=()=>[...db.appts,...deadlineAppointments()].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
function appointmentItem(x){
 if(!x.auto)return item('appts',x);
 const cls=dc(x.date);
 return `<div class="row">${dot(cls)}<div class="x"><b>🔔 ${esc(x.agency)}</b><small>${fmt(x.date)} · ${esc(x.contact)} · ${esc(fn(x.famId))}</small><small>Ablauf: ${fmt(x.expiry)} (28 Tage vorher)</small></div><button onclick="detail='${x.famId}';tab='fam';render()" aria-label="Akte öffnen">Akte</button></div>`;
}
const appointmentList=a=>a.length?a.map(appointmentItem).join(''):'<div class="empty">Keine Termine oder Fristen</div>';
const list=(c,a)=>a.length?a.map(x=>item(c,x)).join(''):'<div class="empty">Keine Einträge</div>';
function render(){
 $('#nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';detail=null;render()"><b>${t[1]}</b>${t[2]}</button>`).join('');
 $('#back').style.display=detail?'':'none';$('#ttl').textContent=detail?fn(detail):'Fallhilfe';
 let h='',add=null;const open=[...db.tasks,...db.reminders].filter(x=>!x.done);
 if(detail)h=famDetail(fam(detail));
 else if(tab=='home'){
  const od=open.filter(x=>x.due&&days(x.due)<0).sort(sortD),td=db.appts.filter(x=>x.date==T),soon=db.appts.filter(x=>x.date>T&&days(x.date)<=14).sort((a,b)=>a.date.localeCompare(b.date));
  h=`<div class="grid"><div class="card stat" onclick="tab='appt';render()"><b>${td.length}</b><span>Termine heute</span></div>
  <div class="card stat" onclick="tab='task';render()"><b>${db.tasks.filter(x=>!x.done).length}</b><span>Offene Aufgaben</span></div>
  <div class="card stat" onclick="tab='task';render()"><b style="color:var(--r)">${od.length}</b><span>Überfällig</span></div>
  <div class="card stat" onclick="tab='fam';render()"><b>${db.families.length}</b><span>Akten</span></div></div>
  <h3>Heute fällige Termine</h3>${list('appts',td)}<h3>Überfällig</h3>${od.map(x=>item(db.tasks.includes(x)?'tasks':'reminders',x)).join('')||'<div class="empty">Nichts überfällig 🎉</div>'}
  <h3>Termine in 14 Tagen</h3>${list('appts',soon)}
  <div class="card" style="font-size:13px;color:var(--m)">Ampel: <i class="dot g"></i> aktuell &nbsp;<i class="dot y"></i> innerhalb 14 Tage &nbsp;<i class="dot r"></i> überfällig</div>`}
 else if(tab=='fam'){add=['families'];
  const s=q.toLowerCase(),fs=db.families.filter(f=>(f.name+' '+f.address+' '+f.contact+' '+members(f).map(p=>p.name).join(' ')).toLowerCase().includes(s)).sort((a,b)=>a.name.localeCompare(b.name));
  h=`<input id="q" placeholder="🔍 Aktenname, Person oder Unterkunft suchen" value="${esc(q)}" oninput="q=this.value;render();const e=$('#q');e.focus();e.setSelectionRange(99,99)">
  <div style="height:10px"></div>`+(fs.map(f=>`<div class="row" onclick="detail='${f.id}';render()">${dot(famCls(f))}<div class="x"><b>${esc(f.name)}</b><small>${isFamily(f)?'Familienakte · '+count(f)+' Personen':'Einzelakte'} · ${esc(f.address||'')} · ${esc(f.country||'')}</small></div></div>`).join('')||'<div class="empty">Keine Akten gefunden. Mit + anlegen.</div>')}
 else if(tab=='task'){add=['tasks'];h=chips()+list('tasks',db.tasks.filter(x=>flt=='open'?!x.done:!!x.done).sort(sortD))}
 else if(tab=='rem'){add=['reminders'];h=chips()+list('reminders',db.reminders.filter(x=>flt=='open'?!x.done:!!x.done).sort(sortD))}
 else if(tab=='appt'){add=['appts'];h='<div class="card" style="font-size:13px;color:var(--m)">Bewilligungen und Dokumente mit Ablaufdatum werden automatisch 28 Tage vorher als Frist angezeigt. Die Erinnerung passt sich an, wenn du das Ablaufdatum änderst.</div>'+appointmentList(allAppointments())}
 else h=exportView();
 $('#v').innerHTML=h+(add?`<button class="fab" onclick="edit('${add[0]}')">+</button>`:'')}
const chips=()=>`<div class="chips" style="margin-bottom:10px"><button class="${flt=='open'?'on':''}" onclick="flt='open';render()">Offen</button><button class="${flt=='done'?'on':''}" onclick="flt='done';render()">Erledigt</button></div>`;
function famDetail(f){if(!f)return'';
 const mainRows=[...personRows(f).slice(0,3),['Ansprechpartner',f.contact],['Herkunftsland',f.country],...(isFamily(f)?[['Personen',count(f)]]:[]),...(f.births?[['Frühere Geburtsdaten (Altbestand)',f.births]]:[]),['Telefon',f.phone],['E-Mail',f.email],['Unterkunft',f.address],['Einzug',fmt(f.moveIn)],...personRows(f).slice(3),['Notizen',f.notes]];
 return`<div class="card">${dot(famCls(f))} <b>${esc(f.name)}</b> <small>· ${isFamily(f)?'Familienakte':'Einzelakte'}</small><table>${infoRows(mainRows)}</table>
 <div class="btns"><button class="p" onclick="edit('families','${f.id}')">Bearbeiten</button>${f.phone?`<a href="tel:${esc(f.phone)}"><button>📞 Anrufen</button></a>`:''}<button onclick="pdf('${f.id}')">📄 Fallakte PDF</button></div></div>
 ${infoRows(benefitRows(f))?`<h3>Erhaltene Leistungen</h3><div class="card"><table>${infoRows(benefitRows(f))}</table></div>`:''}
 <h3>Dokumente – ${esc(f.name)}</h3><div class="card"><table>${docRows(f)}</table><div class="btns"><button onclick="editDocs('${f.id}')">Standarddokumente bearbeiten</button></div>${customDocList(f,f,null)}</div>
 ${isFamily(f)?`<h3>Weitere Personen</h3>${members(f).map(p=>`<div class="card"><b>${esc(p.name)}</b><table>${infoRows(personRows(p))}</table><div class="btns"><button onclick="editPerson('${f.id}','${p.id}')">Person bearbeiten</button><button onclick="editDocs('${f.id}','${p.id}')">Standarddokumente bearbeiten</button></div><table>${docRows(p)}</table>${customDocList(f,p,p.id)}</div>${infoRows(benefitRows(p))?`<h3>Erhaltene Leistungen – ${esc(p.name)}</h3><div class="card"><table>${infoRows(benefitRows(p))}</table></div>`:''}`).join('')||'<div class="empty">Noch keine weiteren Personen</div>'}<button class="big" onclick="editPerson('${f.id}')">+ Weitere Person hinzufügen</button>`:''}
 <h3>Aufgaben</h3>${list('tasks',db.tasks.filter(x=>x.famId==f.id).sort(sortD))}<button class="big" onclick="edit('tasks',0,{famId:'${f.id}'})">+ Aufgabe</button>
 <h3>Wiedervorlagen</h3>${list('reminders',db.reminders.filter(x=>x.famId==f.id).sort(sortD))}<button class="big" onclick="edit('reminders',0,{famId:'${f.id}'})">+ Wiedervorlage</button>
 <h3>Termine und Fristen</h3>${appointmentList(allAppointments().filter(x=>x.famId==f.id))}<button class="big" onclick="edit('appts',0,{famId:'${f.id}'})">+ Termin</button>`}
function exportView(){return`<div class="card"><b>PDF-Fallakte</b><label>Akte<select id="pf">${db.families.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><button class="big" onclick="pdf($('#pf').value)">📄 Fallakte als PDF (Drucken → Als PDF speichern)</button></div>
 <button class="big" onclick="excel()">📊 Excel-Export (.xls)</button><button class="big" onclick="backup()">💾 Datensicherung (JSON) herunterladen</button>
 <label class="big" style="display:block">⬆️ Datensicherung wiederherstellen<input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label>
 <button class="big" onclick="setPin()">🔒 PIN-Sperre ${localStorage.getItem('fh_pin')?'ändern / entfernen':'festlegen'}</button>
 <div class="card" style="font-size:13px;color:var(--m)"><b>Datenschutz:</b> Die App sendet keine Daten ins Internet (technisch gesperrt) und nutzt keine Cookies, Tracker oder externen Dienste. Alle Daten liegen ausschließlich lokal im Browser dieses Geräts. Die PIN ist nur ein Zugriffsschutz, keine Verschlüsselung: Bitte Displaysperre und Geräteverschlüsselung nutzen. JSON-, Excel- und PDF-Dateien enthalten Klartext-Daten und müssen geschützt aufbewahrt und gelöscht werden (DSGVO, Löschfristen beachten).</div>`}
async function hp(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fh'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(p)}}
function lockNow(){if(localStorage.getItem('fh_pin')){$('#lock').style.display='flex';$('#pin').value='';$('#lerr').textContent=''}}
async function unlock(){if(await hp($('#pin').value)==localStorage.getItem('fh_pin'))$('#lock').style.display='none';else $('#lerr').textContent='Falsche PIN'}
async function setPin(){if(localStorage.getItem('fh_pin')&&await hp(prompt('Aktuelle PIN:')||'')!=localStorage.getItem('fh_pin'))return alert('Falsche PIN');
 const n=prompt('Neue PIN (mind. 4 Ziffern; leer lassen = PIN entfernen):');if(n===null)return;
 if(!n){localStorage.removeItem('fh_pin');render();return}if(n.length<4)return alert('Zu kurz');localStorage.setItem('fh_pin',await hp(n));render();alert('PIN gesetzt')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)lockNow()});lockNow();
function dl(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function backup(){dl('fallhilfe-sicherung-'+T+'.json','application/json',JSON.stringify(db,null,1))}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.families)throw 0;if(confirm('Aktuelle Daten werden ersetzt. Fortfahren?')){db={families:d.families||[],tasks:d.tasks||[],reminders:d.reminders||[],appts:d.appts||[]};save();render()}}catch(e){alert('Ungültige Datei')}};r.readAsText(f)}
function excel(){const S=(n,rows)=>`<Worksheet ss:Name="${n}"><Table>`+rows.map(r=>'<Row>'+r.map(c=>`<Cell><Data ss:Type="String">${esc(c)}</Data></Cell>`).join('')+'</Row>').join('')+'</Table></Worksheet>';
 const people=db.families.flatMap(f=>[[f,f,'Hauptperson'],...(isFamily(f)?members(f).map(p=>[f,p,'Weitere Person']):[])]);
 const x='<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
 S('Akten',[['Name','Vorname','Nachname','Aktenart','Geburtsdatum','Geschlecht','Ansprechpartner','Herkunftsland','Personen','Telefon','E-Mail','Unterkunft','Einzug','Ampel'],...db.families.map(f=>[f.name,names(f).firstName,names(f).lastName,isFamily(f)?'Familienakte':'Einzelakte',fmt(f.birthDate),f.gender,f.contact,f.country,count(f),f.phone,f.email,f.address,fmt(f.moveIn),{g:'Grün',y:'Gelb',r:'Rot'}[famCls(f)]])])+
 S('Personen',[['Akte','Person','Vorname','Nachname','Geburtsdatum','Geschlecht','Rolle','Arbeitgeber','Besucht Kindergarten bzw. Schule','Kindergarten bzw. Schule','Klasse / Gruppe','Schuljahr','Sonstiges','Nachmittagsbetreuung','Träger Nachmittagsbetreuung','Bildung und Teilhabe (Mittagessen) – Bewilligung bis','Träger der Nachmittagsbetreuung – Bewilligung bis','Jugendamt (Nachmittagsbetreuung) – Bewilligung bis','Grundsicherung (SGB XII) – Bezug','Grundsicherung (SGB XII) – Bewilligung bis','Jobcenter (SGB II) – Bezug','Jobcenter (SGB II) – Bewilligung bis','Kindergeld – Bezug','Kindergeld – Bewilligung bis'],...people.map(([f,p,rolle])=>[f.name,p.name,names(p).firstName,names(p).lastName,fmt(p.birthDate),p.gender,rolle,p.employer,p.attendsInstitution||(attending(p)?'Ja':''),p.school,p.schoolClass,p.schoolYear,p.clubs,p.afternoonCare,p.careProvider,fmt(p.renewBut),fmt(p.renewProvider),fmt(p.renewYouth),p.benefitSgb12,fmt(p.benefitSgb12Until),p.benefitSgb2,fmt(p.benefitSgb2Until),p.benefitChild,fmt(p.benefitChildUntil)])])+
 S('Dokumente',[['Akte','Person','Dokument','Status','Gültig bis'],...people.flatMap(([f,p])=>allDocs(p).map(d=>[f.name,p.name,d.name,d.s||'',fmt(d.e)]))])+
 S('Aufgaben',[['Aufgabe','Akte','Fällig','Priorität','Status'],...db.tasks.map(t=>[t.title,fn(t.famId),fmt(t.due),t.prio,t.done?'erledigt':'offen'])])+
 S('Wiedervorlagen',[['Stelle','Betreff','Akte','Datum','Status'],...db.reminders.map(t=>[t.type,t.title,fn(t.famId),fmt(t.due),t.done?'erledigt':'offen'])])+
 S('Termine',[['Datum','Uhrzeit','Behörde','Ansprechpartner','Akte','Notizen'],...allAppointments().map(t=>[fmt(t.date),t.time,t.agency,t.contact,fn(t.famId),t.notes])])+'</Workbook>';
 dl('fallhilfe-'+T+'.xls','application/vnd.ms-excel',x)}

 const tb=(h,rows)=>{if(!rows.length)return '';const indices=h.map((_,i)=>i).filter(i=>rows.some(row=>String(row[i]??'').trim()));return indices.length?`<table><tr>${indices.map(i=>`<th>${esc(h[i])}</th>`).join('')}</tr>${rows.map(c=>`<tr>${indices.map(i=>`<td>${esc(c[i])}</td>`).join('')}</tr>`).join('')}</table>`:''};
 const docs=p=>{const rows=allDocs(p).filter(d=>d.s||d.e).map(d=>[d.name,d.s||'',fmt(d.e)]);return rows.length?`<h3>Dokumente</h3>${tb(['Dokument','Status','Gültig bis'],rows)}`:''};
 const base=[...personRows(f).slice(0,3),['Ansprechpartner',f.contact],['Herkunftsland',f.country],...(isFamily(f)?[['Personen',count(f)]]:[]),...(f.births?[['Frühere Geburtsdaten (Altbestand)',f.births]]:[]),['Telefon',f.phone],['E-Mail',f.email],['Unterkunft',f.address],['Einzug',fmt(f.moveIn)],...personRows(f).slice(3),['Notizen',f.notes]];
 const section=(title,heads,rows)=>rows.length?`<h2>${title}</h2>${tb(heads,rows)}`:'';
 $('#print').innerHTML=`<h1>Fallakte ${esc(f.name)}</h1><p>Stand: ${fmt(T)} · ${isFamily(f)?'Familienakte':'Einzelakte'}</p>${infoRows(base)?`<table>${infoRows(base,true)}</table>`:''}${infoRows(benefitRows(f),true)?`<h2>Erhaltene Leistungen</h2><table>${infoRows(benefitRows(f),true)}</table>`:''}${docs(f)}
 ${isFamily(f)?members(f).map(p=>`<h2>Weitere Person: ${esc(p.name)}</h2>${infoRows(personRows(p))?`<table>${infoRows(personRows(p),true)}</table>`:''}${infoRows(benefitRows(p),true)?`<h3>Erhaltene Leistungen</h3><table>${infoRows(benefitRows(p),true)}</table>`:''}${docs(p)}`).join(''):''}
 ${section('Aufgaben',['Aufgabe','Fällig','Prio','Status'],db.tasks.filter(x=>x.famId==id).map(t=>[t.title,fmt(t.due),t.prio,t.done?'erledigt':'offen']))}
 ${section('Wiedervorlagen',['Stelle','Betreff','Datum','Status'],db.reminders.filter(x=>x.famId==id).map(t=>[t.type,t.title,fmt(t.due),t.done?'erledigt':'offen']))}
 ${section('Termine',['Datum','Zeit','Behörde','Ansprechpartner','Notizen'],allAppointments().filter(x=>x.famId==id).map(t=>[fmt(t.date),t.time,t.agency,t.contact,t.notes]))}`;
 setTimeout(()=>window.print(),100)}

// Auf Mobilgeräten ändert die Browser-/Tastaturleiste den tatsächlich sichtbaren Ausschnitt.
// Das Bearbeitungsformular wird auf diesen Ausschnitt begrenzt und bleibt separat scrollbar.
function updateVisualViewport(){
 const vv=window.visualViewport;if(!vv)return;
 document.documentElement.style.setProperty('--vv-height',vv.height+'px');
 document.documentElement.style.setProperty('--vv-top',vv.offsetTop+'px');
 const keyboardVisible=window.innerWidth<=700&&vv.height<window.innerHeight-140;
 document.body.classList.toggle('keyboard-open',keyboardVisible);
}
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',updateVisualViewport);
 window.visualViewport.addEventListener('scroll',updateVisualViewport);
}
window.addEventListener('resize',updateVisualViewport);
document.addEventListener('focusin',e=>{
 if(!e.target.closest?.('#modal'))return;
 requestAnimationFrame(()=>e.target.scrollIntoView({block:'nearest',behavior:'instant'}));
});
